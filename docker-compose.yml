version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibely-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibely_password}
      POSTGRES_DB: ${POSTGRES_DB:-vibely}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibely}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vibely-network

  redis:
    image: redis:7-alpine
    container_name: vibely-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vibely-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: vibely-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vibely.app}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vibely-network

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: vibely-web
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vibely-network

volumes:
  postgres_data:
  redis_data:

networks:
  vibely-network:
    driver: bridge
