# =====================================================================
# Infrastructure - Docker Compose
# PostgreSQL, Redis, and the NestJS backend.
# =====================================================================
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibely-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibely
      POSTGRES_PASSWORD: vibely
      POSTGRES_DB: vibely
    ports:
      - "5432:5432"
    volumes:
      - vibely-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibely"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vibely-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - vibely-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
    container_name: vibely-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vibely:vibely@postgres:5432/vibely?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      API_PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ../services/backend/src:/app/src
      - ../services/backend/prisma:/app/prisma
      - /app/node_modules

volumes:
  vibely-pg-data:
  vibely-redis-data:
